plugins { id 'com.android.application' }

android {
    namespace 'com.consegvida.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.consegvida.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs = ['../../shared']
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// Deliberately no runtime dependencies or remote services.
