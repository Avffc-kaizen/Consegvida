name: ConsegVida iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consegvida-ios-testflight
  cancel-in-progress: false

jobs:
  distribute:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Avffc-kaizen/Consegvida' && github.ref == 'refs/heads/main'
    environment: apple-testflight
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the verified xtool release without Apple account setup
        run: bash mobile/scripts/install_xtool_macos.sh
      - name: Validate Apple configuration, sign and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: bash .github/scripts/ios-testflight.sh
